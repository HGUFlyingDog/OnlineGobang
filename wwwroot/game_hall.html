<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏大厅</title>
    <link rel="stylesheet" href="./css/common.css" />
    <link rel="stylesheet" href="./css/game_hall.css" />
  </head>
  <body>
    <div class="nav">网络五子棋对战游戏</div>
    <!-- 整个页面的容器元素 -->
    <div class="container">
      <!-- 这个 div 在 container 中是处于垂直水平居中这样的位置的 -->
      <div>
        <!-- 展示用户信息 -->
        <div id="screen"></div>
        <!-- 匹配按钮 -->
        <div id="match-button">开始匹配</div>
      </div>
    </div>

    <script src="./js/jquery.min.js"></script>

    <script>
      var ws_url = "ws://" + location.host + "/hall"; // 创建一个连接的Url
      var ws_hdl = null; // 点击按钮需要发送数据 所以放在全局

      window.onbeforeunload = function () {
        ws_hdl.close();
      };

      var buttonElement = document.getElementById("match-button");
      var buttonFlag = "stop";
      buttonElement.onclick = function () {
        if (buttonFlag == "stop") // 发送开始请求
        {
          var JsonReq = {
            optype: "match_start",
          };
          ws_hdl.send(JSON.stringify(JsonReq));
        } else // 发送停止请求
        {
          var JsonReq = {
            optype: "match_stop",
          };
          ws_hdl.send(JSON.stringify(JsonReq));
        }
        // 状态的修改放到回调函数里面
      };

      function getUserInfo() {
        $.ajax({
          url: "/info",
          type: "GET",
          success: function (res) {
            var info_html =
              "<p>" +
              "用户:" +
              res.username +
              " 得分:" +
              res.score +
              "<br>" +
              "比赛场次: " +
              res.total_count +
              " 获胜场次:" +
              res.win_count;

            var Screen_div = document.getElementById("screen");
            Screen_div.innerHTML = info_html;

            ws_hdl = new WebSocket(ws_url);
            // 设置回调函数

            ws_hdl.onopen = ws_open;
            ws_hdl.onclose = ws_close;
            ws_hdl.onerror = ws_onErr;
            ws_hdl.onmessage = ws_message;
          },
          error: function (xhr) {
            alert(JSON.stringify(xhr));
            location.replace("/login.html");
          },
        });
      }

      function ws_open() {
        console.log("WebSocket连接已建立");
      }
      function ws_close() {
        console.log("WebSocket连接已关闭");
      }
      function ws_onErr() {
        console.log("WebSocket连接发生错误");
      }
      function ws_message(event) {
        var rsp = JSON.parse(event.data);
        if (rsp["result"] == false) {
          alert(rsp.reason);
          location.replace("/login.html");
          return;
        }

        if (rsp["optype"] == "hall_ready") {
          alert("游戏大厅建立成功");
        } else if (rsp["optype"] == "match_success") {
          alert(rsp["匹配成功"]);
          location.replace("/game_room.html");
        } else if (rsp["optype"] == "match_start") {
          console.log("玩家进入匹配队列");
          buttonFlag = "start";
          buttonElement.innerHTML = "匹配中,点击按钮停止匹配";
        } else if (rsp["optype"] == "match_stop") {
          console.log("停止匹配");
          buttonFlag = "stop";
          buttonElement.innerHTML = "开始匹配";
        } else {
          alert(rsp["optype"]);
          location.replace("/login.html");
          return;
        }
      }

      getUserInfo();
    </script>
  </body>
</html>
